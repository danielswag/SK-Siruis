<section class="request__bottom-adaptive">
  <div class="requestBottom__container">
    <div class="request__bottom-top">
      <div class="request__bottom-file">
        <input type="file" id="file" class="file-upload" />

        <label for="file" class="file-upload__label"
          ><span class="file-upload__label-text">Прикрепить файл</span>

          <span class="file-upload__icon"
            ><img
              class="request__bottom-image"
              src="icons/ic_sharp-attach-file.svg"
              alt=""
          /></span>
        </label>
      </div>
      <div class="request__list">
        <ol>
          <li class="request__list-item">
            1. Каким видом деятельности вы занимаетесь?
          </li>
          <li class="request__list-item">2. С чем мы можем помочь?</li>
          <li class="request__list-item">
            3. На какой срок и бюджет рассчитываете?
          </li>
        </ol>
      </div>
    </div>
    <div class="request__bottom-down">
      <button type="button" class="request__bottom-send" id="submit">
        Отправить
      </button>
      <p class="request__success" id="successMessage">Ваша заявка отправлена</p>

      <div class="privacy__policy">
        <input type="checkbox" class="privacy__policy__checkbox" />
        <span
          >Даю согласие на обработку персональных данных и соглашаюсь с
          <span class="privacy__policy-blue">Условиями использования</span>
          и
          <span class="privacy__policy-blue"
            >Политикой конфиденциальности</span
          ></span
        >
      </div>
    </div>
  </div>
</section>
